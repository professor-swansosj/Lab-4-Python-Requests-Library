name: GitHub Classroom Autograding

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-classroom[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Step 2 marker present (5)
        id: step2_marker
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Step 2 marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "[STEP 2] Dev Container Started" logs/lab4.log'
          timeout: 10
          max-score: 5

      - name: Joke HTTP marker present (5)
        id: joke_http_ok
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Joke HTTP marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_JOKE_HTTP_OK" logs/lab4.log'
          timeout: 10
          max-score: 5

      - name: Joke JSON marker present (5)
        id: joke_json_ok
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Joke JSON marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_JOKE_JSON_OK" logs/lab4.log'
          timeout: 10
          max-score: 5

      - name: Joke printed marker present (5)
        id: joke_printed
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Joke printed marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_JOKE_PRINTED" logs/lab4.log'
          timeout: 10
          max-score: 5

      - name: Deck creation marker present (5)
        id: deck_create
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Deck creation marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_DECK_CREATE_OK" logs/lab4.log'
          timeout: 10
          max-score: 5

      - name: Draw marker present (10)
        id: draw_ok
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Draw marker present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_DRAW_OK" logs/lab4.log'
          timeout: 10
          max-score: 10

      - name: Tie logic marker or implementation present (10)
        id: tie_round
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Tie logic marker or implementation present
          setup-command: ''
          command: '(test -f logs/lab4.log && grep -Fq "LAB4_TIE_ROUND" logs/lab4.log) || grep -Fq "LAB4_TIE_ROUND" src/high_card.py'
          timeout: 10
          max-score: 10

      - name: Game end marker and result artifact present (10)
        id: game_end
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Game end marker and result artifact present
          setup-command: ''
          command: 'test -f logs/lab4.log && grep -Fq "LAB4_GAME_END" logs/lab4.log && test -s data/high_card_result.txt'
          timeout: 10
          max-score: 10

      - name: Error handling marker present (5)
        id: error_marker
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Error handling marker present
          setup-command: ''
          command: '(test -f logs/lab4.log && grep -Fq "LAB4_ERR" logs/lab4.log) || (grep -Fq "LAB4_ERR" src/tell_me_a_joke.py && grep -Fq "LAB4_ERR" src/high_card.py)'
          timeout: 10
          max-score: 5

      - name: Submission markers complete (15)
        id: submission_complete
        if: always()
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Submission markers complete
          setup-command: ''
          command: >-
            test -f logs/lab4.log &&
            grep -Eq "LAB4[-_]START" logs/lab4.log &&
            grep -Fq "[STEP 2] Dev Container Started" logs/lab4.log &&
            grep -Fq "LAB4_JOKE_HTTP_OK" logs/lab4.log &&
            grep -Fq "LAB4_JOKE_JSON_OK" logs/lab4.log &&
            grep -Fq "LAB4_JOKE_PRINTED" logs/lab4.log &&
            grep -Fq "LAB4_DECK_CREATE_OK" logs/lab4.log &&
            grep -Fq "LAB4_DRAW_OK" logs/lab4.log &&
            grep -Fq "LAB4_GAME_END" logs/lab4.log &&
            grep -Eq "LAB4[-_]END" logs/lab4.log
          timeout: 10
          max-score: 15

      - name: Autograding Reporter
        if: always()
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          STEP2_MARKER_RESULTS: "${{ steps.step2_marker.outputs.result }}"
          JOKE_HTTP_OK_RESULTS: "${{ steps.joke_http_ok.outputs.result }}"
          JOKE_JSON_OK_RESULTS: "${{ steps.joke_json_ok.outputs.result }}"
          JOKE_PRINTED_RESULTS: "${{ steps.joke_printed.outputs.result }}"
          DECK_CREATE_RESULTS: "${{ steps.deck_create.outputs.result }}"
          DRAW_OK_RESULTS: "${{ steps.draw_ok.outputs.result }}"
          TIE_ROUND_RESULTS: "${{ steps.tie_round.outputs.result }}"
          GAME_END_RESULTS: "${{ steps.game_end.outputs.result }}"
          ERROR_MARKER_RESULTS: "${{ steps.error_marker.outputs.result }}"
          SUBMISSION_COMPLETE_RESULTS: "${{ steps.submission_complete.outputs.result }}"
        with:
          runners: step2_marker,joke_http_ok,joke_json_ok,joke_printed,deck_create,draw_ok,tie_round,game_end,error_marker,submission_complete
